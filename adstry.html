<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="A modern, fast and responsive online calculator."
  />

  <title>Modern Calculator</title>

  <style>
    /* =========================
       RESET & ROOT VARIABLES
    ========================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #f3f5f9;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
      --text: #16181d;
      --muted: #727782;
      --border: rgba(20, 25, 35, 0.08);

      --primary: #5b5df0;
      --primary-dark: #4749d8;
      --danger: #e65353;
      --operator: #eef0ff;

      --shadow:
        0 20px 60px rgba(35, 40, 70, 0.10),
        0 5px 20px rgba(35, 40, 70, 0.06);
    }

    body.dark {
      --bg: #11131a;
      --surface: rgba(28, 31, 42, 0.92);
      --surface-solid: #1c1f2a;
      --text: #f5f6fa;
      --muted: #9ca1ae;
      --border: rgba(255, 255, 255, 0.08);

      --primary: #7779ff;
      --primary-dark: #6567e8;
      --danger: #ff6b6b;
      --operator: #282c42;

      --shadow:
        0 20px 60px rgba(0, 0, 0, 0.30),
        0 5px 20px rgba(0, 0, 0, 0.20);
    }

    body {
      min-height: 100vh;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;

      background:
        radial-gradient(
          circle at top left,
          rgba(91, 93, 240, 0.13),
          transparent 35%
        ),
        var(--bg);

      color: var(--text);
      transition:
        background 0.3s ease,
        color 0.3s ease;
    }

    button {
      font: inherit;
      border: none;
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================== */
    header {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;

      display: grid;
      place-items: center;

      background: linear-gradient(
        135deg,
        var(--primary),
        #9a62ff
      );

      color: white;
      font-size: 24px;
      font-weight: 800;

      box-shadow: 0 10px 25px rgba(91, 93, 240, 0.28);
    }

    .brand h1 {
      font-size: 18px;
      line-height: 1.2;
    }

    .brand p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .theme-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;

      display: grid;
      place-items: center;

      background: var(--surface-solid);
      color: var(--text);
      border: 1px solid var(--border);

      font-size: 20px;
      transition: 0.2s ease;
    }

    .theme-btn:hover {
      transform: translateY(-2px);
    }

    /* =========================
       MAIN LAYOUT
    ========================== */
    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding-bottom: 30px;
    }

    .ad-section {
      width: 100%;
      min-height: 90px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      margin-bottom: 28px;

      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 24px;
      align-items: start;
    }

    /* =========================
       CALCULATOR
    ========================== */
    .calculator {
      padding: 24px;

      border-radius: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .display {
      min-height: 145px;
      padding: 20px;
      margin-bottom: 20px;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;

      overflow: hidden;

      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .expression {
      width: 100%;
      min-height: 25px;

      text-align: right;
      word-break: break-all;

      color: var(--muted);
      font-size: 17px;
      margin-bottom: 8px;
    }

    .result {
      width: 100%;

      text-align: right;
      word-break: break-all;

      color: var(--text);
      font-size: clamp(32px, 7vw, 48px);
      font-weight: 700;
      letter-spacing: -1.5px;
    }

    .display-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 18px;
    }

    .mini-btn {
      padding: 9px 13px;
      border-radius: 10px;

      background: var(--surface-solid);
      color: var(--text);
      border: 1px solid var(--border);

      font-size: 13px;
      font-weight: 600;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .calc-btn {
      min-height: 62px;
      border-radius: 18px;

      background: var(--surface-solid);
      color: var(--text);

      font-size: 20px;
      font-weight: 650;

      border: 1px solid var(--border);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);

      transition:
        transform 0.12s ease,
        background 0.2s ease;
    }

    .calc-btn:hover {
      transform: translateY(-2px);
    }

    .calc-btn:active {
      transform: scale(0.96);
    }

    .operator {
      background: var(--operator);
      color: var(--primary);
    }

    .clear {
      background: rgba(230, 83, 83, 0.12);
      color: var(--danger);
    }

    .equal {
      background: var(--primary);
      color: white;
      border-color: transparent;
    }

    .equal:hover {
      background: var(--primary-dark);
    }

    .zero {
      grid-column: span 2;
    }

    /* =========================
       HISTORY
    ========================== */
    .history-card {
      padding: 22px;

      border-radius: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 18px;
    }

    .history-header h2 {
      font-size: 18px;
    }

    .clear-history {
      padding: 8px 11px;

      border-radius: 10px;
      background: transparent;
      color: var(--danger);

      font-size: 12px;
      font-weight: 600;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;

      max-height: 460px;
      overflow-y: auto;
    }

    .history-item {
      padding: 14px;

      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 16px;

      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .history-item:hover {
      transform: translateX(3px);
    }

    .history-expression {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 5px;
      word-break: break-all;
    }

    .history-result {
      font-size: 18px;
      font-weight: 700;
      word-break: break-all;
    }

    .empty-history {
      padding: 30px 10px;

      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       FOOTER
    ========================== */
    footer {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 10px 0 28px;

      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       RESPONSIVE
    ========================== */
    @media (max-width: 800px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .history-list {
        max-height: 250px;
      }
    }

    @media (max-width: 480px) {
      header,
      main,
      footer {
        width: min(100% - 20px, 1100px);
      }

      header {
        padding: 14px 0;
      }

      .calculator,
      .history-card {
        padding: 16px;
        border-radius: 22px;
      }

      .display {
        min-height: 125px;
        padding: 16px;
      }

      .buttons {
        gap: 9px;
      }

      .calc-btn {
        min-height: 58px;
        border-radius: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->
  <header>
    <div class="brand">
      <div class="brand-icon">+</div>

      <div>
        <h1>Modern Calculator</h1>
        <p>Fast, simple and responsive</p>
      </div>
    </div>

    <button
      class="theme-btn"
      id="themeToggle"
      aria-label="Toggle dark mode"
      title="Toggle theme"
    >
      🌙
    </button>
  </header>


  <!-- =========================
       MAIN CONTENT
  ========================== -->
  <main>

   


    <div class="content-grid">

      <!-- CALCULATOR -->
      <section class="calculator">

        <div class="display">
          <div class="expression" id="expression"></div>
          <div class="result" id="result">0</div>
        </div>

        <div class="display-actions">
          <button class="mini-btn" id="copyBtn">
            Copy Result
          </button>
        </div>

        <div class="buttons">

          <button class="calc-btn clear" data-action="clear">C</button>
          <button class="calc-btn operator" data-action="delete">⌫</button>
          <button class="calc-btn operator" data-value="%">%</button>
          <button class="calc-btn operator" data-value="/">÷</button>

          <button class="calc-btn" data-value="7">7</button>
          <button class="calc-btn" data-value="8">8</button>
          <button class="calc-btn" data-value="9">9</button>
          <button class="calc-btn operator" data-value="*">×</button>

          <button class="calc-btn" data-value="4">4</button>
          <button class="calc-btn" data-value="5">5</button>
          <button class="calc-btn" data-value="6">6</button>
          <button class="calc-btn operator" data-value="-">−</button>

          <button class="calc-btn" data-value="1">1</button>
          <button class="calc-btn" data-value="2">2</button>
          <button class="calc-btn" data-value="3">3</button>
          <button class="calc-btn operator" data-value="+">+</button>

          <button class="calc-btn zero" data-value="0">0</button>
          <button class="calc-btn" data-value=".">.</button>
          <button class="calc-btn equal" data-action="equals">=</button>

        </div>
      </section>

          <!-- =========================
         ADSTERRA BANNER AD2
    ========================== -->

        <div class="ad-section" aria-label="Advertisement">

     <script 
        async="async" 
        data-cfasync="false" 
        src="https://pl30884304.effectivecpmnetwork.com/7fca955b2adba8f8a7e88618b42db2db/invoke.js">
    </script>
        <div id="container-7fca955b2adba8f8a7e88618b42db2db"></div>

    </div>


      <!-- HISTORY -->
      <aside class="history-card">

        <div class="history-header">
          <h2>History</h2>

          <button
            class="clear-history"
            id="clearHistory"
          >
            Clear
          </button>
        </div>

        <div
          class="history-list"
          id="historyList"
        >
          <div class="empty-history">
            No calculations yet.
          </div>
        </div>

      </aside>

    </div>
  </main>


  <!-- =========================
       FOOTER
  ========================== -->
  <footer>
    © <span id="year"></span> Modern Calculator
  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->
  <script>
    const resultElement = document.getElementById("result");
    const expressionElement = document.getElementById("expression");
    const historyList = document.getElementById("historyList");

    let expression = "";
    let history =
      JSON.parse(localStorage.getItem("calculatorHistory")) || [];


    /* =========================
       DISPLAY FUNCTIONS
    ========================== */

    function formatExpression(text) {
      return text
        .replace(/\*/g, "×")
        .replace(/\//g, "÷");
    }

    function updateDisplay() {
      expressionElement.textContent =
        formatExpression(expression);

      resultElement.textContent =
        expression === "" ? "0" : expression;
    }


    /* =========================
       INPUT HANDLING
    ========================== */

    function isOperator(value) {
      return ["+", "-", "*", "/", "%"].includes(value);
    }

    function addValue(value) {

      if (isOperator(value)) {

        if (expression === "" && value !== "-") {
          return;
        }

        const lastChar =
          expression.charAt(expression.length - 1);

        if (isOperator(lastChar)) {
          expression =
            expression.slice(0, -1) + value;
        } else {
          expression += value;
        }

      } else if (value === ".") {

        const currentNumber =
          expression.split(/[+\-*/%]/).pop();

        if (!currentNumber.includes(".")) {

          if (
            expression === "" ||
            isOperator(
              expression.charAt(expression.length - 1)
            )
          ) {
            expression += "0.";
          } else {
            expression += ".";
          }

        }

      } else {
        expression += value;
      }

      updateDisplay();
    }


    /* =========================
       CALCULATE
    ========================== */

    function calculate() {

      if (expression === "") {
        return;
      }

      const lastChar =
        expression.charAt(expression.length - 1);

      if (isOperator(lastChar)) {
        expression = expression.slice(0, -1);
      }

      try {

        // Only allow calculator characters
        if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {
          throw new Error("Invalid input");
        }

        const originalExpression = expression;

        const calculation = Function(
          `"use strict"; return (${expression})`
        )();

        if (!Number.isFinite(calculation)) {
          throw new Error("Invalid result");
        }

        const finalResult =
          Math.round(
            (calculation + Number.EPSILON) * 100000000
          ) / 100000000;

        expressionElement.textContent =
          formatExpression(originalExpression) + " =";

        resultElement.textContent =
          finalResult;

        addHistory(
          originalExpression,
          finalResult
        );

        expression = String(finalResult);

      } catch (error) {

        resultElement.textContent = "Error";

        setTimeout(() => {
          updateDisplay();
        }, 1200);

      }

    }


    /* =========================
       CLEAR / DELETE
    ========================== */

    function clearCalculator() {
      expression = "";
      expressionElement.textContent = "";
      resultElement.textContent = "0";
    }

    function deleteLast() {
      expression = expression.slice(0, -1);
      updateDisplay();
    }


    /* =========================
       HISTORY
    ========================== */

    function addHistory(expr, answer) {

      history.unshift({
        expression: expr,
        result: answer
      });

      // Keep last 30 calculations
      history = history.slice(0, 30);

      localStorage.setItem(
        "calculatorHistory",
        JSON.stringify(history)
      );

      renderHistory();
    }

    function renderHistory() {

      historyList.innerHTML = "";

      if (history.length === 0) {

        historyList.innerHTML = `
          <div class="empty-history">
            No calculations yet.
          </div>
        `;

        return;
      }

      history.forEach((item) => {

        const div =
          document.createElement("div");

        div.className = "history-item";

        div.innerHTML = `
          <div class="history-expression">
            ${formatExpression(item.expression)}
          </div>

          <div class="history-result">
            = ${item.result}
          </div>
        `;

        div.addEventListener("click", () => {
          expression = String(item.result);
          updateDisplay();
        });

        historyList.appendChild(div);

      });

    }


    /* =========================
       BUTTON EVENTS
    ========================== */

    document.querySelectorAll(".calc-btn")
      .forEach((button) => {

        button.addEventListener("click", () => {

          const value =
            button.dataset.value;

          const action =
            button.dataset.action;

          if (value !== undefined) {
            addValue(value);
          }

          if (action === "clear") {
            clearCalculator();
          }

          if (action === "delete") {
            deleteLast();
          }

          if (action === "equals") {
            calculate();
          }

        });

      });


    /* =========================
       KEYBOARD SUPPORT
    ========================== */

    document.addEventListener(
      "keydown",
      (event) => {

        const key = event.key;

        if (
          /^[0-9]$/.test(key) ||
          ["+", "-", "*", "/", "%", "."].includes(key)
        ) {
          addValue(key);
        }

        if (key === "Enter" || key === "=") {
          event.preventDefault();
          calculate();
        }

        if (key === "Backspace") {
          deleteLast();
        }

        if (key === "Escape") {
          clearCalculator();
        }

      }
    );


    /* =========================
       COPY RESULT
    ========================== */

    document
      .getElementById("copyBtn")
      .addEventListener("click", async () => {

        const text =
          resultElement.textContent;

        if (
          text === "0" ||
          text === "Error"
        ) {
          return;
        }

        try {

          await navigator.clipboard.writeText(text);

          const button =
            document.getElementById("copyBtn");

          const originalText =
            button.textContent;

          button.textContent = "Copied!";

          setTimeout(() => {
            button.textContent = originalText;
          }, 1200);

        } catch (error) {
          alert("Could not copy the result.");
        }

      });


    /* =========================
       CLEAR HISTORY
    ========================== */

    document
      .getElementById("clearHistory")
      .addEventListener("click", () => {

        history = [];

        localStorage.removeItem(
          "calculatorHistory"
        );

        renderHistory();

      });


    /* =========================
       THEME
    ========================== */

    const themeToggle =
      document.getElementById("themeToggle");

    const savedTheme =
      localStorage.getItem("calculatorTheme");

    if (savedTheme === "dark") {
      document.body.classList.add("dark");
      themeToggle.textContent = "☀️";
    }

    themeToggle.addEventListener("click", () => {

      document.body.classList.toggle("dark");

      const isDark =
        document.body.classList.contains("dark");

      localStorage.setItem(
        "calculatorTheme",
        isDark ? "dark" : "light"
      );

      themeToggle.textContent =
        isDark ? "☀️" : "🌙";

    });


    /* =========================
       INITIALIZE
    ========================== */

    document.getElementById("year")
      .textContent =
      new Date().getFullYear();

    renderHistory();
    updateDisplay();

  </script>

</body>
</html>
